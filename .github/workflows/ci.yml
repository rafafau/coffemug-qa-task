name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: coffemug-qa-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: self-hosted
    timeout-minutes: 10
    needs: build

    steps:
      - name: Run ESLint in Docker
        run: docker run --rm coffemug-qa-test:latest pnpm lint

      - name: Run Prettier check in Docker
        run: docker run --rm coffemug-qa-test:latest pnpm format:check

  test:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Run Playwright tests in Docker
        run: docker run --rm -v $(pwd)/playwright-report:/playwright-report -v $(pwd)/test-results:/test-results coffemug-qa-test:latest pnpm dotenvx run -f .env.ci -- npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
