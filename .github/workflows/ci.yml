name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Clean workspace
        run: sudo rm -rf test-results || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: coffemug-qa-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: self-hosted
    timeout-minutes: 10
    needs: build

    steps:
      - name: Run ESLint in Docker
        run: docker run --rm coffemug-qa-test:latest pnpm lint

      - name: Run Prettier check in Docker
        run: docker run --rm coffemug-qa-test:latest pnpm format:check

  test:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: lint
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create output directories
        run: mkdir -p test-results

      - name: Run Playwright tests in Docker
        run: docker run --rm -e CI=true -e DOTENV_PRIVATE_KEY_CI="${DOTENV_PRIVATE_KEY_CI}" -v $(pwd)/test-results:/app/test-results coffemug-qa-test:latest pnpm dotenvx run -f .env.ci -- npx playwright test
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
