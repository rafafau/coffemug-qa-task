name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: coffemug-qa-test:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  lint:
    runs-on: self-hosted
    timeout-minutes: 10
    needs: build

    steps:
      - name: Run ESLint
        run: docker run --rm -v $(pwd):/app -w /app coffemug-qa-test:latest pnpm lint

      - name: Run Prettier check
        run: docker run --rm -v $(pwd):/app -w /app coffemug-qa-test:latest pnpm format:check

  test:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: lint
    environment: dev

    steps:
      - name: Run Playwright tests
        run: docker run --rm -e CI=true -e DOTENV_PRIVATE_KEY_CI="${DOTENV_PRIVATE_KEY_CI}" -v $(pwd)/test-results:/app/test-results coffemug-qa-test:latest pnpm dotenvx run -f .env.ci -- npx playwright test
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/results.xml